<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>AI診断プロンプトどうぶつガチャ</title>
<style>
  :root{
    --ink:#2b2440;
    --sub:#8b81ad;
    --bg1:#faf8ff;
    --bg2:#fff5fa;
    --pink:#ff8fb8;
    --pink-deep:#ff6aa0;
    --mint:#57d9a8;
    --mint-deep:#2fbd8a;
    --blue:#7fa8d9;
    --blue-deep:#4f7fc0;
    --teal:#3fbf8f;
    --teal-deep:#249c6f;
    --gold:#f6c453;
    --gold-deep:#e0a52a;
    --lavender:#b7a4f0;
    --card-radius:22px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{
    margin:0; padding:0; height:100%;
    background:
      radial-gradient(circle at 12% 8%, rgba(255,143,184,0.22), transparent 42%),
      radial-gradient(circle at 88% 6%, rgba(127,168,217,0.22), transparent 40%),
      radial-gradient(circle at 20% 90%, rgba(87,217,168,0.20), transparent 42%),
      radial-gradient(circle at 90% 85%, rgba(183,164,240,0.20), transparent 42%),
      linear-gradient(180deg, var(--bg1) 0%, var(--bg2) 100%);
    color:var(--ink);
    font-family:"Hiragino Sans","Yu Gothic",-apple-system,BlinkMacSystemFont,sans-serif;
    overflow-x:hidden;
    min-height:100vh;
    touch-action:pan-y;
  }
  .blobs{
    position:fixed; inset:0; z-index:0; pointer-events:none; overflow:hidden;
  }
  .blobs span{
    position:absolute; border-radius:50%; filter:blur(2px); opacity:.55;
    animation: floaty 7s ease-in-out infinite alternate;
  }
  .blobs span:nth-child(1){ width:14px; height:14px; background:var(--pink); top:12%; left:8%; animation-delay:.2s; }
  .blobs span:nth-child(2){ width:10px; height:10px; background:var(--blue); top:20%; right:10%; animation-delay:1.1s; }
  .blobs span:nth-child(3){ width:12px; height:12px; background:var(--mint); top:70%; left:6%; animation-delay:.6s; }
  .blobs span:nth-child(4){ width:9px; height:9px; background:var(--lavender); top:78%; right:12%; animation-delay:1.6s; }
  .blobs span:nth-child(5){ width:7px; height:7px; background:var(--gold); top:45%; left:4%; animation-delay:.9s; }
  .blobs span:nth-child(6){ width:8px; height:8px; background:var(--pink-deep); top:36%; right:6%; animation-delay:.4s; }
  @keyframes floaty{ from{ transform:translateY(0);} to{ transform:translateY(-16px);} }

  .app{
    position:relative; z-index:1;
    max-width:480px; margin:0 auto;
    min-height:100vh;
    padding:calc(18px + env(safe-area-inset-top)) 18px calc(28px + env(safe-area-inset-bottom));
    display:flex; flex-direction:column;
  }

  header{ text-align:center; margin-bottom:6px; }
  header .badge{
    display:inline-block; font-size:11px; font-weight:800; letter-spacing:.12em; color:var(--pink-deep);
    border:1px solid rgba(255,143,184,.5); border-radius:999px; padding:4px 13px;
    margin-bottom:9px; background:rgba(255,255,255,.7); box-shadow:0 2px 8px rgba(255,143,184,.18);
  }
  header h1{
    font-size:23px; margin:0 0 5px; font-weight:800; color:var(--ink);
  }
  header p{ margin:0; font-size:12.5px; color:var(--sub); }

  .topbar{
    display:flex; justify-content:flex-end; align-items:center;
    margin:14px 0 4px; font-size:12px;
  }
  .collection-btn{
    display:flex; align-items:center; gap:6px;
    background:#fff; border:1px solid rgba(43,36,64,.08);
    border-radius:999px; padding:7px 14px; color:var(--ink); font-size:12.5px; font-weight:700;
    box-shadow:0 3px 10px rgba(43,36,64,.08);
    cursor:pointer;
  }
  .collection-btn b{ color:var(--gold-deep); }

  /* ---- Gacha stage ---- */
  .stage{
    position:relative;
    flex:1;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    min-height:400px;
    margin-top:4px;
  }

  .hint{
    text-align:center; font-size:12.5px; color:var(--sub); font-weight:600;
    margin-bottom:14px;
  }

  .machine{
    position:relative;
    display:flex; flex-direction:column; align-items:center;
  }

  .machine-body{
    position:relative; z-index:1;
    width:216px; height:246px;
    border-radius:108px 108px 26px 26px;
    background:linear-gradient(160deg, #fff0f6 0%, #ffe2ee 55%, #ffd3e4 100%);
    border:3px solid #fff;
    box-shadow:0 14px 30px rgba(255,143,184,.28), inset 0 -12px 18px rgba(255,143,184,.15);
  }

  .machine-window{
    position:absolute; top:14px; left:50%; transform:translateX(-50%);
    width:148px; height:148px; border-radius:50%;
    background:radial-gradient(circle at 35% 28%, rgba(255,255,255,.92), rgba(207,232,255,.55) 72%);
    border:5px solid rgba(255,255,255,.95);
    box-shadow:inset 0 8px 14px rgba(127,168,217,.25), 0 4px 10px rgba(127,168,217,.2);
    overflow:hidden;
  }
  .window-glare{
    position:absolute; top:10px; left:18px; width:42px; height:64px; border-radius:50%;
    background:rgba(255,255,255,.55); transform:rotate(-18deg); filter:blur(2px);
    pointer-events:none;
  }
  .pile-ball{ position:absolute; border-radius:50%; box-shadow:0 2px 3px rgba(43,36,64,.15); }

  .machine-panel{
    position:absolute; top:170px; left:50%; transform:translateX(-50%);
    width:172px; height:32px; border-radius:12px;
    background:linear-gradient(160deg, #fff, #ffe9f1);
    border:2px solid #fff;
    box-shadow:inset 0 2px 4px rgba(43,36,64,.06);
    display:flex; align-items:center; justify-content:center; gap:10px;
  }
  .coin-slot{ width:30px; height:9px; border-radius:5px; background:rgba(43,36,64,.25); box-shadow:inset 0 2px 3px rgba(0,0,0,.3); }
  .panel-light{ width:9px; height:9px; border-radius:50%; background:var(--gold); box-shadow:0 0 6px var(--gold); }

  .dispense-flap{
    position:absolute; bottom:16px; left:50%; transform:translateX(-50%);
    width:74px; height:20px; border-radius:6px 6px 12px 12px;
    background:rgba(43,36,64,.18);
    box-shadow:inset 0 3px 5px rgba(0,0,0,.3);
    z-index:4;
  }

  .lever-track{
    position:absolute; right:-18px; top:128px;
    width:26px; height:82px; border-radius:14px;
    background:linear-gradient(180deg, #e8e2f7, #d3c9ee);
    box-shadow:inset 0 3px 6px rgba(43,36,64,.25);
    touch-action:none; user-select:none;
    display:flex; justify-content:center;
    z-index:3;
  }
  .lever-rail{
    width:4px; height:100%; border-radius:2px; background:rgba(43,36,64,.18);
  }
  .lever-arrow{
    position:absolute; top:-20px; left:50%; transform:translateX(-50%);
    font-size:13px; color:var(--pink-deep); animation:bobDown 1.3s ease-in-out infinite;
  }
  @keyframes bobDown{ 0%,100%{ transform:translate(-50%,0);} 50%{ transform:translate(-50%,6px);} }
  .lever-handle{
    position:absolute; top:2px; left:50%; transform:translate(-50%,0);
    width:26px; height:26px; border-radius:50%;
    background:radial-gradient(circle at 35% 30%, #fff, var(--gold) 75%);
    box-shadow:0 4px 10px rgba(224,165,42,.5), 0 0 0 3px #fff;
    cursor:grab;
    transition:transform .3s cubic-bezier(.34,1.56,.64,1);
  }
  .lever-handle.dragging{ transition:none; cursor:grabbing; }
  .lever-handle.springing{ transition:transform .4s cubic-bezier(.34,1.56,.64,1); }

  .machine-base{
    width:250px; height:30px; margin-top:-6px;
    border-radius:14px;
    background:linear-gradient(160deg, #ffe2ee, #ffd3e4);
    border:3px solid #fff; border-top:none;
    box-shadow:0 10px 20px rgba(255,143,184,.25);
  }

  .capsule{
    position:absolute; left:50%; bottom:-6px;
    width:110px; height:138px;
    transform:translate(-50%,0) scale(0);
    transform-origin:center bottom;
    opacity:0;
    will-change:transform, opacity;
  }
  .capsule.appear{ animation:popIn .32s cubic-bezier(.34,1.56,.64,1) forwards; }
  @keyframes popIn{
    0%{   transform:translate(-50%,0) scale(0); opacity:0; }
    55%{  transform:translate(-50%,-14px) scale(1.12); opacity:1; }
    100%{ transform:translate(-50%,0) scale(1); opacity:1; }
  }
  /* static "settled" state used during the pause beat, and as the resting
     baseline that .bouncing / .bursting animate on top of */
  .capsule.show{ transform:translate(-50%,0) scale(1); opacity:1; }

  .capsule.bouncing{ animation:capsuleBounce .55s ease-in-out infinite; }
  .capsule.bouncing.bouncing-rare{ animation-duration:.42s; }
  .capsule.bouncing.bouncing-ssr{ animation-duration:.34s; }
  @keyframes capsuleBounce{
    0%,100%{ transform:translate(-50%,0) scale(1,1); }
    18%{ transform:translate(-50%,-24px) scale(.94,1.1); }
    38%{ transform:translate(-50%,0) scale(1.1,.88); }
    55%{ transform:translate(-50%,-11px) scale(.97,1.05); }
    72%{ transform:translate(-50%,0) scale(1.05,.95); }
    88%{ transform:translate(-50%,-4px) scale(1,1.02); }
  }
  .capsule.bouncing .capsule-glow{ animation:chargePulse .5s ease-in-out infinite; }
  .capsule.bouncing.bouncing-rare .capsule-glow{ animation-duration:.38s; background:radial-gradient(circle, rgba(87,217,168,0.55), transparent 70%); }
  .capsule.bouncing.bouncing-ssr .capsule-glow{ animation-duration:.26s; background:radial-gradient(circle, rgba(246,196,83,0.65), transparent 70%); }
  @keyframes chargePulse{
    0%,100%{ transform:scale(1); opacity:.55; }
    50%{ transform:scale(1.9); opacity:1; }
  }
  .capsule.bursting .capsule-top{ animation:burstTop 1.1s ease-out forwards; }
  .capsule.bursting .capsule-bottom{ animation:burstBottom 1.1s ease-out forwards; }
  .capsule.bursting .capsule-seam{ animation:burstFade .6s ease-out forwards; }
  .capsule.bursting .capsule-mark{ animation:burstFade .6s ease-out forwards; }
  @keyframes burstTop{
    0%{   transform:translateY(0) rotate(0deg); opacity:1; }
    35%{  transform:translate(-14px,-52px) rotate(-28deg); opacity:1; }
    100%{ transform:translate(-30px,-110px) rotate(-65deg); opacity:0; }
  }
  @keyframes burstBottom{
    0%{   transform:translateY(0) rotate(0deg); opacity:1; }
    35%{  transform:translate(14px,48px) rotate(28deg); opacity:1; }
    100%{ transform:translate(30px,102px) rotate(65deg); opacity:0; }
  }
  @keyframes burstFade{
    0%{ opacity:1; transform:scale(1); }
    45%{ opacity:.7; transform:scale(1.35); }
    100%{ opacity:0; transform:scale(2.1); }
  }
  .capsule-top{
    position:absolute; top:0; left:8px; right:8px; height:72px;
    border-radius:55px 55px 12px 12px;
    background:linear-gradient(160deg, #fff 0%, #ffd3e4 45%, var(--pink) 100%);
    box-shadow:0 6px 18px rgba(255,143,184,.4), inset 0 -6px 10px rgba(0,0,0,.08);
  }
  .capsule-bottom{
    position:absolute; bottom:0; left:0; right:0; height:82px;
    border-radius:12px 12px 55px 55px;
    background:linear-gradient(160deg, #d4fbec 0%, var(--mint) 100%);
    box-shadow:0 6px 18px rgba(87,217,168,.35), inset 0 -6px 10px rgba(0,0,0,.1);
  }
  .capsule-seam{
    position:absolute; left:0; right:0; top:50%; height:7px; transform:translateY(-50%);
    background:var(--gold); border-radius:4px; box-shadow:0 1px 4px rgba(0,0,0,.15);
  }
  .capsule-glow{
    position:absolute; inset:-26px; border-radius:50%;
    background:radial-gradient(circle, rgba(255,255,255,0.5), transparent 70%);
    pointer-events:none;
  }
  .capsule-mark{
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    font-size:28px; filter:drop-shadow(0 2px 3px rgba(0,0,0,.15));
  }

  .prob{
    text-align:center; font-size:11px; color:var(--sub); margin-top:12px; line-height:1.6;
  }
  .prob span{ margin:0 6px; }

  /* ---- Flash / burst overlay ---- */
  .flash-overlay{
    position:fixed; inset:0; z-index:50; pointer-events:none;
    display:flex; align-items:center; justify-content:center;
    opacity:0; --flash-dur:.55s;
  }
  .flash-overlay.on{ animation: flashPop var(--flash-dur) ease-out forwards; }
  @keyframes flashPop{
    0%{ opacity:0; }
    14%{ opacity:1; }
    55%{ opacity:.85; }
    100%{ opacity:0; }
  }
  .flash-overlay.rarity-ssr.on{ background:radial-gradient(circle, #fff8d6 0%, var(--gold) 35%, var(--pink) 70%, transparent 100%); }
  .flash-overlay.rarity-rare.on{ background:radial-gradient(circle, #e4fff4 0%, var(--teal) 45%, transparent 100%); }
  .flash-overlay.rarity-normal.on{ background:radial-gradient(circle, #eaf2ff 0%, var(--blue) 55%, transparent 100%); opacity:0; }
  .flash-overlay.rarity-normal.on{ animation-name:flashPopSoft; }
  @keyframes flashPopSoft{
    0%{ opacity:0; } 20%{ opacity:.6; } 100%{ opacity:0; }
  }

  .burst-rays{
    position:fixed; inset:0; z-index:49; pointer-events:none; opacity:0;
    display:flex; align-items:center; justify-content:center;
    --ray-dur:1.1s;
  }
  .burst-rays.on{ opacity:1; animation: raysFade var(--ray-dur) ease-out forwards; }
  .burst-rays::before{
    content:''; position:absolute; width:140vmax; height:140vmax;
    background:repeating-conic-gradient(rgba(246,196,83,.5) 0deg 4deg, transparent 4deg 16deg);
    animation: raysSpin var(--ray-dur) linear forwards;
  }
  @keyframes raysSpin{ from{ transform:rotate(0);} to{ transform:rotate(90deg);} }
  @keyframes raysFade{ 0%{opacity:1} 70%{opacity:.6} 100%{opacity:0} }

  .shake{ animation: screenShake .45s; }
  @keyframes screenShake{
    0%,100%{ transform:translate(0,0); }
    20%{ transform:translate(-6px,3px); }
    40%{ transform:translate(6px,-3px); }
    60%{ transform:translate(-4px,2px); }
    80%{ transform:translate(4px,-2px); }
  }

  .confetti-piece{
    position:fixed; top:-10px; z-index:48; pointer-events:none;
    width:8px; height:14px; opacity:.95;
    animation: confettiFall linear forwards;
  }
  @keyframes confettiFall{
    to{ transform:translateY(115vh) rotate(600deg); opacity:0; }
  }

  /* ---- Result modal ---- */
  .modal-backdrop{
    position:fixed; inset:0; z-index:60;
    background:rgba(43,36,64,0.55); backdrop-filter:blur(4px);
    display:flex; align-items:center; justify-content:center;
    padding:20px; opacity:0; pointer-events:none;
    transition:opacity .25s;
  }
  .modal-backdrop.show{ opacity:1; pointer-events:auto; }

  .result-card{
    width:100%; max-width:340px;
    background:#fff;
    border-radius:var(--card-radius);
    color:var(--ink);
    padding:18px 18px 20px;
    position:relative;
    box-shadow:0 20px 50px rgba(43,36,64,.25);
    transform:scale(.7) translateY(30px); opacity:0;
    transition:transform .45s cubic-bezier(.34,1.56,.64,1), opacity .35s;
  }
  .modal-backdrop.show .result-card{ transform:scale(1) translateY(0); opacity:1; }

  .result-card.tier-ssr{ box-shadow:0 0 0 2px var(--gold), 0 20px 50px rgba(246,196,83,.4); }
  .result-card.tier-rare{ box-shadow:0 0 0 2px var(--teal), 0 20px 50px rgba(63,191,143,.3); }
  .result-card.tier-normal{ box-shadow:0 0 0 2px var(--blue), 0 20px 50px rgba(127,168,217,.25); }

  .card-top-row{ display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:2px; }
  .card-no-wrap{ display:flex; flex-direction:column; gap:2px; }
  .card-no{ font-size:10.5px; color:var(--sub); letter-spacing:.05em; }
  .card-type{ font-size:9.5px; color:#c3bbe0; letter-spacing:.1em; }
  .rarity-chip{
    font-size:11px; font-weight:800; padding:3px 10px; border-radius:999px; letter-spacing:.05em;
  }
  .rarity-chip.ssr{ background:linear-gradient(90deg,var(--gold),#fff3d0); color:#7a4b00; }
  .rarity-chip.rare{ background:linear-gradient(90deg,var(--teal),#d8fbec); color:#0d5c3f; }
  .rarity-chip.normal{ background:linear-gradient(90deg,var(--blue),#e4eeff); color:#26436b; }

  .avatar-wrap{ display:flex; justify-content:center; margin:10px 0 4px; }
  .avatar-circle{
    position:relative;
    width:112px; height:112px; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    font-size:56px;
    background:radial-gradient(circle at 35% 30%, #fff, #f1edfb 70%);
  }
  .avatar-circle img{ width:88%; height:88%; object-fit:contain; object-position:center bottom; }
  .avatar-circle.ssr{ background:radial-gradient(circle at 35% 28%, #fffaf0, #ffe6a8 75%); box-shadow:0 0 0 4px #fff, 0 0 0 7px var(--gold), 0 10px 24px rgba(246,196,83,.5); }
  .avatar-circle.rare{ background:radial-gradient(circle at 35% 28%, #f0fffa, #bdf3dd 75%); box-shadow:0 0 0 4px #fff, 0 0 0 7px var(--teal), 0 10px 24px rgba(63,191,143,.4); }
  .avatar-circle.normal{ background:radial-gradient(circle at 35% 28%, #f3f8ff, #cfe3ff 75%); box-shadow:0 0 0 4px #fff, 0 0 0 7px var(--blue), 0 10px 20px rgba(127,168,217,.3); }
  .avatar-crown{
    position:absolute; top:-8px; right:-8px;
    width:30px; height:30px; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    font-size:15px;
    box-shadow:0 3px 6px rgba(0,0,0,.2), 0 0 0 3px #fff;
  }
  .avatar-crown.ssr{ background:linear-gradient(160deg,#fff, var(--gold)); }
  .avatar-crown.rare{ background:linear-gradient(160deg,#fff, var(--teal)); }
  .avatar-crown.normal{ background:linear-gradient(160deg,#fff, var(--blue)); }

  .card-stars{ text-align:center; font-size:14px; letter-spacing:2px; margin:8px 0 4px; }
  .card-stars .on{ color:var(--gold-deep); }
  .card-stars .off{ color:#e3ddf4; }

  .card-title{
    position:relative;
    text-align:center; font-size:19px; font-weight:800; color:var(--ink);
    margin:10px 0 16px; padding-bottom:10px; line-height:1.35;
  }
  .card-title::after{
    content:''; position:absolute; left:50%; bottom:0; transform:translateX(-50%);
    width:34px; height:3px; border-radius:2px; background:#e3ddf4;
  }
  .result-card.tier-ssr .card-title::after{ background:var(--gold); }
  .result-card.tier-rare .card-title::after{ background:var(--teal); }
  .result-card.tier-normal .card-title::after{ background:var(--blue); }
  .card-catch{
    position:relative;
    text-align:center; font-size:12.5px; color:#5c5480;
    background:#f6f3ff; border-radius:14px; padding:9px 12px; margin-bottom:14px;
    line-height:1.5;
  }
  .card-catch::after{
    content:''; position:absolute; left:50%; top:-6px; transform:translateX(-50%);
    border-width:0 7px 7px 7px; border-style:solid;
    border-color:transparent transparent #f6f3ff transparent;
  }

  .toggle-prompt-btn{
    width:100%; padding:11px; border-radius:12px; border:none;
    background:var(--ink); color:#fff; font-size:13.5px; font-weight:700;
    cursor:pointer; margin-bottom:8px;
  }
  .prompt-box{ display:none; margin-bottom:10px; }
  .prompt-box.show{ display:block; }
  .prompt-box textarea{
    width:100%; height:170px; resize:vertical;
    border:1px solid #e5defa; border-radius:10px; padding:10px;
    font-size:12px; line-height:1.6; color:#3a325c; background:#faf8ff;
    font-family:inherit;
  }
  .copy-btn{
    margin-top:6px; width:100%; padding:10px; border-radius:10px; border:none;
    background:var(--gold); color:#4a2f00; font-weight:800; font-size:13px; cursor:pointer;
  }
  .copy-btn.copied{ background:var(--mint); color:#0c4a24; }

  .modal-actions{ display:flex; gap:8px; margin-top:4px; }
  .modal-actions button{
    flex:1; padding:11px; border-radius:12px; border:none; font-size:13px; font-weight:700; cursor:pointer;
  }
  .btn-close{ background:#f1edfb; color:var(--sub); }
  .btn-again{ background:linear-gradient(135deg, var(--pink-deep), var(--lavender)); color:#fff; }

  /* ---- Collection overlay ---- */
  .collection-backdrop{
    position:fixed; inset:0; z-index:55;
    background:linear-gradient(180deg, var(--bg1), var(--bg2));
    display:flex; flex-direction:column;
    opacity:0; pointer-events:none; transition:opacity .2s;
  }
  .collection-backdrop.show{ opacity:1; pointer-events:auto; }
  .collection-header{
    display:flex; justify-content:space-between; align-items:center;
    padding:calc(16px + env(safe-area-inset-top)) 18px 10px;
  }
  .collection-header h2{ font-size:16px; margin:0; color:var(--ink); }
  .collection-header button{
    background:#fff; border:1px solid rgba(43,36,64,.1); color:var(--ink);
    border-radius:999px; width:32px; height:32px; font-size:15px; cursor:pointer;
    box-shadow:0 2px 8px rgba(43,36,64,.08);
  }
  .collection-grid{
    flex:1; overflow-y:auto; padding:8px 18px 24px;
    display:grid; grid-template-columns:repeat(2,1fr); gap:12px;
  }
  .col-item{
    background:#fff; border:1px solid rgba(43,36,64,.06);
    border-radius:16px; padding:12px; text-align:center; cursor:pointer;
    box-shadow:0 4px 14px rgba(43,36,64,.06);
  }
  .col-item.locked{ opacity:.5; background:#f4f1fa; box-shadow:none; }
  .col-item .em{
    font-size:26px; margin:0 auto 6px; width:56px; height:56px; border-radius:50%;

  .col-item .sub{ font-size:10px; color:var(--sub); margin-top:1px; }
  .col-item .rr{ font-size:9.5px; margin-top:4px; letter-spacing:.05em; font-weight:700; }
  .col-item.tier-ssr .rr{ color:var(--gold-deep); }
  .col-item.tier-rare .rr{ color:var(--teal-deep); }
  .col-item.tier-normal .rr{ color:var(--blue-deep); }
</style>

  const RARITY_INFO = {
    SSR:    { label:'SSR',    stars:'★★★', weight:0.10, class:'ssr',    badge:'👑' },
    Rare:   { label:'RARE',   stars:'★★☆', weight:0.30, class:'rare',   badge:'🎖️' },
    Normal: { label:'NORMAL', stars:'★☆☆', weight:0.60, class:'normal', badge:'⭐' }
  };

  const STORAGE_KEY = 'prompt_gacha_collection_v1';

  let collection = {};
  try{ collection = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}'); }catch(e){ collection = {}; }

  const $ = (id) => document.getElementById(id);

  const leverWrap = $('leverWrap');
  const leverHandle = $('leverHandle');
  const leverArrow = $('leverArrow');
  const capsule = $('capsule');
  const hintText = $('hintText');
  const flashOverlay = $('flashOverlay');
  const burstRays = $('burstRays');
  const modalBackdrop = $('modalBackdrop');
  const resultCard = $('resultCard');
  const collectionCountEl = $('collectionCount');

  let isDragging = false;
  let startY = 0;
  let dragY = 0;
  let busy = false;
  const LEVER_RANGE = 46;   // px the handle can travel down the track
  const THRESHOLD = 30;     // px pulled to trigger the gacha

  function updateTopStats(){
    const owned = Object.keys(collection).length;
    collectionCountEl.textContent = `${owned}/5`;
  }
  updateTopStats();

  function pickRarity(){
    const r = Math.random();
    if(r < RARITY_INFO.SSR.weight) return 'SSR';
    if(r < RARITY_INFO.SSR.weight + RARITY_INFO.Rare.weight) return 'Rare';
    return 'Normal';
  }

  function pickPrompt(){
    const rarity = pickRarity();
    const pool = PROMPTS.filter(p => p.rarity === rarity);
    return pool[Math.floor(Math.random() * pool.length)];
  }

  function onPointerDown(e){
    if(busy) return;
    isDragging = true;
    startY = (e.touches ? e.touches[0].clientY : e.clientY);
    leverHandle.classList.add('dragging');
    leverHandle.classList.remove('springing');
  }
  function onPointerMove(e){
    if(!isDragging || busy) return;
    const y = (e.touches ? e.touches[0].clientY : e.clientY);
    let delta = y - startY;
    if(delta < 0) delta = delta * 0.2; // slight resistance if pushed up
    if(delta > LEVER_RANGE) delta = LEVER_RANGE;
    dragY = delta;
    leverHandle.style.transform = `translate(-50%, ${delta}px)`;
    leverArrow.style.opacity = Math.max(0, 1 - delta / LEVER_RANGE);
    if(e.cancelable) e.preventDefault();
  }
  function onPointerUp(){
    if(!isDragging || busy) return;
    isDragging = false;
    leverHandle.classList.remove('dragging');
    leverHandle.classList.add('springing');
    leverHandle.style.transform = 'translate(-50%, 0)';
    leverArrow.style.opacity = 1;
    if(dragY >= THRESHOLD){
      launchGacha();
    }
    dragY = 0;
  }

  leverWrap.addEventListener('mousedown', onPointerDown);
  window.addEventListener('mousemove', onPointerMove);
  window.addEventListener('mouseup', onPointerUp);
  leverWrap.addEventListener('touchstart', onPointerDown, {passive:true});
  leverWrap.addEventListener('touchmove', onPointerMove, {passive:false});
  leverWrap.addEventListener('touchend', onPointerUp);

  function spawnConfetti(count){
    const colors = ['#f6c453','#ff8fb8','#57d9a8','#7fa8d9','#b7a4f0'];
    for(let i=0;i<count;i++){
      const piece = document.createElement('div');
      piece.className = 'confetti-piece';
      piece.style.left = (Math.random()*100) + 'vw';
      piece.style.background = colors[Math.floor(Math.random()*colors.length)];
      piece.style.animationDuration = (1.6 + Math.random()*1.2) + 's';
      piece.style.transform = `rotate(${Math.random()*360}deg)`;
      document.body.appendChild(piece);
      setTimeout(() => piece.remove(), 3200);
    }
  }

  const APPEAR_TIME  = 320;  // capsule popping out of the dispense flap
  const PAUSE_TIME   = { SSR:480, Rare:340, Normal:200 };   // brief stillness right after it pops out
  const BOUNCE_TIME  = { SSR:2000, Rare:1300, Normal:700 }; // hopping beat before it splits open
  const FLASH_DUR    = { SSR:'1.9s', Rare:'1s', Normal:'.55s' };
  const FLASH_HOLD   = { SSR:2800, Rare:1800, Normal:1200 }; // time for the burst halves + light to play before the card shows

  function launchGacha(){
    busy = true;

    const item = pickPrompt();
    const info = RARITY_INFO[item.rarity];
    const rarityMod = item.rarity === 'SSR' ? ' bouncing-ssr' : item.rarity === 'Rare' ? ' bouncing-rare' : '';

    capsule.className = 'capsule appear';

    setTimeout(() => {
      capsule.className = 'capsule show'; // pop settles, brief pause

      setTimeout(() => {
        capsule.className = 'capsule show bouncing' + rarityMod;

        setTimeout(() => {
          capsule.className = 'capsule show bursting';
          triggerFlash(item, info);

          setTimeout(() => {
            flashOverlay.className = 'flash-overlay';
            burstRays.className = 'burst-rays';
            showResult(item);
            resetCapsule();
          }, FLASH_HOLD[item.rarity]);
        }, BOUNCE_TIME[item.rarity]);
      }, PAUSE_TIME[item.rarity]);
    }, APPEAR_TIME);
  }

  function triggerFlash(item, info){
    const dur = FLASH_DUR[item.rarity];
    flashOverlay.style.setProperty('--flash-dur', dur);
    burstRays.style.setProperty('--ray-dur', dur);
    flashOverlay.className = 'flash-overlay rarity-' + info.class + ' on';
    if(item.rarity !== 'Normal'){

    if(item.rarity === 'SSR'){

      spawnConfetti(40);
      setTimeout(() => document.body.classList.remove('shake'), 460);
      setTimeout(() => {
        document.body.classList.add('shake');
        spawnConfetti(24);
        setTimeout(() => document.body.classList.remove('shake'), 400);
      }, 750);
    }else if(item.rarity === 'Rare'){
      spawnConfetti(16);
    }
  }

  function resetCapsule(){
    capsule.className = 'capsule';
  }

  function showResult(item){
    collection[item.id] = true;
    localStorage.setItem(STORAGE_KEY, JSON.stringify(collection));
    updateTopStats();

    renderCard(item);
    modalBackdrop.classList.add('show');
    busy = false;
  }

  function renderCard(item){
    const info = RARITY_INFO[item.rarity];
    resultCard.className = 'result-card tier-' + info.class;
    $('cardNo').textContent = `Collection No. ${String(item.id).padStart(2,'0')}/5`;
    $('cardType').textContent = `TYPE ${String(item.id).padStart(2,'0')}`;
    const chip = $('rarityChip');
    chip.textContent = info.label;
    chip.className = 'rarity-chip ' + info.class;
    $('avatarCircle').className = 'avatar-circle ' + info.class;
    const crown = $('avatarCrown');
    crown.className = 'avatar-crown ' + info.class;
    crown.textContent = info.badge;
    $('cardEmoji').src = item.image;
    $('cardStars').innerHTML = info.stars.split('').map(c => `<span class="${c==='★'?'on':'off'}">${c}</span>`).join('');
    $('cardTitle').textContent = item.title;
    $('cardCatch').textContent = `「${item.catch}」`;
    $('promptText').value = item.prompt;
    $('promptBox').classList.remove('show');
    $('togglePrompt').textContent = '📜 プロンプトを見る';
    const copyBtn = $('copyBtn');
    copyBtn.textContent = 'プロンプトをコピー';
    copyBtn.classList.remove('copied');
  }

  $('togglePrompt').addEventListener('click', () => {
    const box = $('promptBox');
    box.classList.toggle('show');
    $('togglePrompt').textContent = box.classList.contains('show') ? '📜 プロンプトを閉じる' : '📜 プロンプトを見る';
  });

  $('copyBtn').addEventListener('click', async () => {
    const text = $('promptText').value;
    try{
      await navigator.clipboard.writeText(text);
    }catch(e){
      const ta = $('promptText');
      ta.removeAttribute('readonly');
      ta.select();
      document.execCommand('copy');
      ta.setAttribute('readonly','readonly');
    }
    const btn = $('copyBtn');
    btn.textContent = 'コピーしました ✓';
    btn.classList.add('copied');
    setTimeout(() => { btn.textContent = 'プロンプトをコピー'; btn.classList.remove('copied'); }, 1800);
  });

  $('btnClose').addEventListener('click', () => modalBackdrop.classList.remove('show'));
  $('btnAgain').addEventListener('click', () => {
    modalBackdrop.classList.remove('show');
    setTimeout(() => { if(!busy) launchGacha(); }, 260);
  });
  modalBackdrop.addEventListener('click', (e) => { if(e.target === modalBackdrop) modalBackdrop.classList.remove('show'); });

  // ---- Collection ----
  const collectionBackdrop = $('collectionBackdrop');
  const collectionGrid = $('collectionGrid');

  function renderCollection(){
    collectionGrid.innerHTML = '';
    PROMPTS.forEach(item => {
      const owned = !!collection[item.id];
      const info = RARITY_INFO[item.rarity];
      const div = document.createElement('div');
      div.className = 'col-item tier-' + info.class + (owned ? '' : ' locked');
      div.innerHTML = `
        <div class="em">${owned ? `<img src="${item.image}" alt="">` : '❔'}</div>
        <div class="nm">${owned ? item.title : '？？？？？'}</div>
        ${owned ? '' : '<div class="sub">未解放</div>'}
        <div class="rr">${info.label}</div>
      `;
      if(owned){
        div.addEventListener('click', () => {
          collectionBackdrop.classList.remove('show');
          renderCard(item);
          modalBackdrop.classList.add('show');
        });
      }
      collectionGrid.appendChild(div);
    });
  }

  $('openCollection').addEventListener('click', () => {
    renderCollection();
    collectionBackdrop.classList.add('show');
  });
  $('closeCollection').addEventListener('click', () => collectionBackdrop.classList.remove('show'));

})();
</script>
</body>
</html>
